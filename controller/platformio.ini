; SEMI-AMS 主控（ESP32-C3）—— 8 台进料器的局域网群控端
;
;   编译：            pio run
;   串口烧录：        pio run -t upload
;   串口监视：        pio device monitor
;   电脑上跑仿真测试： bash host_test/run.sh
;
; 设计上和 firmware/ 保持一致：不引第三方库，MQTT 用 firmware/src/mqtt_codec.h
; （纯 C++ 的 MQTT 3.1.1 编解码，这里复制了一份），网页和 JSON 都是手写的，
; 这样断网也能编译，也不会因为库升级突然编不过。

[platformio]
default_envs = esp32c3

[env:esp32c3]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1             ; ESP32-C3，4MB Flash
framework = arduino
; 克隆板（非官方 DevKitM）上 80MHz/QIO 经常起不来，报
;   assert failed: do_core_init startup.c:328 (flash_ret == ESP_OK)
; 降到 DIO + 40MHz 兼容性最好，实测 4MB 的 ESP32-C3 都没问题
board_build.flash_mode = dio
board_build.f_flash = 40000000L
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=0               ; 关掉 Arduino 核心的调试输出，串口只留自己的日志
    ; 这块板是原生 USB（USB JTAG/serial debug unit）。不打开下面两项时 Serial 走 UART0（GPIO20/21），
    ; 板子上没引出到 USB，串口一片空白。打开后 Serial 就是 USB CDC，插上就能看日志
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
; 没有 lib_deps：WebServer / WiFi / Preferences / ESPmDNS 都在 Arduino 核心里
