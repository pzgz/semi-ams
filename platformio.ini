; SEMI-AMS 复刻固件（ESP-12S / ESP8266）
;
;   编译：            pio run
;   串口烧录：        pio run -t upload            （CH343P 串口工具，EN 接 RTS、GPIO0 接 DTR）
;   串口监视：        pio device monitor
;   无线升级（OTA）：  pio run -e ota -t upload      （需要已连上 WiFi，先在 [env:ota] 填设备 IP）
;   电脑上跑仿真测试： bash host_test/run.sh

[platformio]
default_envs = esp12s

[env:esp12s]
platform = espressif8266@4.2.1
board = esp12e                         ; ESP-12S 与 ESP-12E 同为 ESP8266EX
framework = arduino
board_build.flash_mode = dout          ; 与原厂烧录教程一致（DOUT 兼容所有 Flash 芯片）
; 按 2MB 分区：固件 + 升级空间约 1.7MB，LittleFS 236KB。ESP-12S 标称 4MB，但 SEMI-AMS 这块板上的模组实测是 2MB
; （Zbit ZB25VQ16），按 4MB 编译时设备会拒绝网页升级和 OTA。2MB 分区在 2MB 和 4MB 的模组上都能用，都能无线升级
board_build.ldscript = eagle.flash.2m256.ld
board_build.filesystem = littlefs
board_build.f_cpu = 160000000L          ; 160MHz：连接拓竹打印机的 TLS 握手快一倍
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder, time
; 串口工具 EN 接 RTS、GPIO0 接 DTR：打开监视器时必须释放这两根线，否则芯片会被按住复位 / 进入下载模式
monitor_rts = 0
monitor_dtr = 0
build_flags =
    -Wall
    -Wl,--wrap=system_restart          ; 重启前先把日志写进文件（见 src/main.cpp 的 __wrap_system_restart）
; 编译器：PlatformIO 仓库里的 toolchain-xtensa（GCC 10.3）只有 Intel 版，Apple 芯片 Mac 需要 Rosetta 才能运行。
; 这里换成 ESPHome 维护的原生 arm64 版：同为 GCC 10.3，作者逐一验证生成代码与 toolchain-xtensa 2.100300.220621 一致，
; ESPHome 2026.10 起 ESP8266 默认就用它。仓库 esphome-libs/xtensa-lx106-elf-toolchain，
; 本包 sha256 = ad0ea929238d9b527c43e0d20257acc2a5680bdb0d2b1cf8f2c99169786217e9
; 在 Intel Mac / Linux / Windows 上编译时，删掉下面两行即可（会自动用回 PlatformIO 官方包）。
platform_packages =
    toolchain-xtensa @ https://github.com/esphome-libs/xtensa-lx106-elf-toolchain/releases/download/10.3.0-esphome.3/toolchain-xtensa-lx106-elf-10.3.0-esphome.3-darwin_arm64.tar.gz
lib_deps =
    ; 点灯 Blinker 库（固定到 2025-03-25 的提交，避免上游改动影响编译）
    https://github.com/blinker-iot/blinker-library.git#c73abe1a091733c62152ddb3c6ff7b1820705b18
    https://github.com/tzapu/WiFiManager.git#v2.0.17

[env:ota]
extends = env:esp12s
upload_protocol = espota
upload_port = 10.0.0.64               ; 设备 IP（网页、App 的 IP 控件、串口日志或路由器里能看到），也可以用 --upload-port 指定
upload_flags =
    --auth=semi-ams                    ; 与 include/config.h 里的 OTA_PASSWORD 一致
